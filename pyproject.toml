[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repobrief"
version = "0.1.0"
description = "Pack any repo into clean LLM context, then chat with it — using Claude, GPT, or a fully offline Ollama model."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Your Name", email = "you@example.com" },
]
keywords = ["llm", "cli", "codebase", "context", "ollama", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "click>=8.0",
    "tiktoken>=0.5.0",
    "pathspec>=0.11.0",
    "requests>=2.28.0",
    "rich>=13.0",
    "pyperclip>=1.8.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4.0",
    "mypy>=1.0",
]
cloud = [
    "anthropic>=0.25.0",
    "openai>=1.0",
]

[project.scripts]
repobrief = "repobrief.cli:main"

[project.urls]
Homepage = "https://github.com/yourusername/repobrief"
Repository = "https://github.com/yourusername/repobrief"
Issues = "https://github.com/yourusername/repobrief/issues"

# -- Tool Configuration --------------------------------------------------------

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
